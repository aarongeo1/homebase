# Prepares the Copilot cloud agent's environment BEFORE it starts working, so it doesn't spend
# time (and credits) discovering how to install Node, .NET and dependencies.
# The job MUST be named `copilot-setup-steps` and this file must be on the default branch.
name: Copilot Setup Steps

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # No services needed: the database is a SQLite file, so every backend test runs on the agent's Linux box.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json
      - run: npm ci
      - run: dotnet restore backend/Homebase.sln
